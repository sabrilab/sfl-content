<title>Budget Saison SFL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one spreadsheet-style sheet. Short title line, then a single table: section rows, editable Qté and Prix cells, totals at the bottom. */
:root {
  --bg: #f4f6fa;
  --sheet: #ffffff;
  --grid: #dde3ec;
  --head: #0b1424;
  --head-fg: #ffffff;
  --sec: #e8eef8;
  --fg: #111a2b;
  --muted: #5d6b82;
  --accent: #1f7ae0;
  --cell: #f1f6ff;
  --total: #0b1424;
  --total-fg: #ffffff;
  --display: "Saira Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070b14; --sheet: #0e1624; --grid: #22304a; --head: #131d30; --head-fg: #eef3fb;
  --sec: #16233a; --fg: #eef3fb; --muted: #93a3bd; --accent: #4aa2ff; --cell: #0a1220;
  --total: #3d9bff; --total-fg: #06101f; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #070b14; --sheet: #0e1624; --grid: #22304a; --head: #131d30; --head-fg: #eef3fb;
  --sec: #16233a; --fg: #eef3fb; --muted: #93a3bd; --accent: #4aa2ff; --cell: #0a1220;
  --total: #3d9bff; --total-fg: #06101f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14.5px/1.4 var(--body); }
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: grid; gap: 18px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }
.top { display: flex; justify-content: space-between; align-items: end; gap: 12px 24px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 5vw, 42px); line-height: 1; margin: 0; }
h1 b { color: var(--accent); font-style: italic; }
.top p { margin: 4px 0 0; color: var(--muted); }
.sum { text-align: right; }
.sum .v { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.sum .n { color: var(--muted); font-size: 13px; }
.scroll { overflow-x: auto; background: var(--sheet); border: 1px solid var(--grid); }
table { border-collapse: collapse; width: 100%; min-width: 680px; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--grid); padding: 6px 10px; text-align: left; vertical-align: middle; }
thead th { background: var(--head); color: var(--head-fg); font-weight: 600; font-size: 13px; position: sticky; top: 0; }
.r { text-align: right; }
td.q, td.pu { width: 96px; padding: 0; background: var(--cell); }
td.tot { width: 110px; font-weight: 600; }
td.note { color: var(--muted); font-size: 13px; width: 32%; }
tr.sec td { background: var(--sec); font-weight: 700; text-transform: uppercase; font-size: 12.5px; letter-spacing: .06em; }
tr.sec td.tot { font-size: 14px; letter-spacing: 0; }
tr.int td.tot { color: var(--muted); font-weight: 500; }
input { font: inherit; color: var(--fg); background: transparent; border: 0; width: 100%; padding: 6px 10px; text-align: right; font-variant-numeric: tabular-nums; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--sheet); }
tfoot td { font-weight: 600; }
tfoot td.pu input { font-weight: 600; }
tfoot tr.grand td { background: var(--total); color: var(--total-fg); font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; border-color: var(--total); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.hint i { display: inline-block; width: 12px; height: 12px; background: var(--cell); border: 1px solid var(--grid); vertical-align: -1px; margin-right: 4px; }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1><b>SFL</b> · Budget saison</h1>
      <p>Captation et sponsoring · 13 dimanches, du 1er novembre 2026 au 24 janvier 2027</p>
    </div>
    <div class="sum"><div class="v" id="grand-top">—</div><div class="n" id="per-day">—</div></div>
  </div>

  <div class="scroll">
    <table>
      <thead><tr><th>Poste</th><th class="r">Qté</th><th class="r">Prix unitaire</th><th class="r">Total</th><th>Note</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot>
        <tr><td colspan="3">Sous-total</td><td class="r tot" id="base">—</td><td></td></tr>
        <tr><td>Imprévus</td><td></td><td class="pu"><input type="number" id="pct" min="0" step="1" aria-label="Pourcentage d'imprévus"></td><td class="r tot" id="cont">—</td><td class="note">% du sous-total</td></tr>
        <tr class="grand"><td colspan="3">Total</td><td class="r" id="grand">—</td><td></td></tr>
      </tfoot>
    </table>
  </div>
  <p class="hint"><i></i>Les cases teintées se modifient comme dans un tableur. Les totaux se recalculent seuls.</p>
</div>

<script>
(() => {
  const SUNDAYS = 13;
  // [poste, qté, prix unitaire, note]
  const DATA = [
    ['Captation & régie', [
      ['iPhone 12 (caméras)', 3, 200, ''],
      ['Mac mini M1 d’occasion', 1, 380, ''],
      ['Batteries externes 20 000 mAh', 3, 30, ''],
      ['Supports / trépieds smartphone', 3, 20, ''],
      ['Routeur 5G + Wi-Fi 6 + Ethernet', 1, 220, ''],
      ['Forfait SIM 5G (1er mois)', 1, 30, ''],
      ['Écran portable régie', 1, 110, ''],
      ['Clavier + souris', 1, 30, ''],
      ['SSD externe 1 To', 1, 80, ''],
      ['Chargeur USB multiports', 1, 40, ''],
      ['Câbles divers (Lightning / USB-C / Ethernet)', 1, 30, ''],
      ['Multiprise / rallonge', 1, 20, ''],
      ['Kit audio DJI 2 micros', 1, 150, ''],
      ['Casque régie', 1, 30, ''],
      ['Stream Deck DIY SFL', 1, 50, ''],
      ['Protection pluie / soleil', 1, 30, ''],
      ['Sac / caisse transport', 1, 40, ''],
      ['Applications / licences', 1, 70, '']
    ]],
    ['Arbitrage', [
      ['Arbitres (rémunération)', 26, 60, '2 arbitres × 13 dimanches'],
      ['Charges sociales', 1, 0, 'Selon le statut des arbitres, à confirmer'],
      ['Tenues arbitres', 2, 40, 'Maillot, sifflet, cartons']
    ]],
    ['Fonctionnement des dimanches', [
      ['Forfait SIM 5G (mois 2 et 3)', 2, 30, ''],
      ['Multistream', 3, 20, '3 mois'],
      ['Stockage cloud des rushs', 3, 10, '3 mois'],
      ['Défraiement bénévoles captation', 26, 15, '2 personnes × 13 dimanches'],
      ['Consommables', 13, 5, 'Gaffer, piles, colliers']
    ]],
    ['Maillots sponsorisés', [
      ['Création graphique du maillot', 1, 300, ''],
      ['Kits joueurs (maillot + short + chaussettes)', 71, 11.25, '13,08 $ pièce (≈ 0,86 €/$) · 8 équipes × 8 joueurs + 10 % de réserve'],
      ['Kits gardien', 8, 11.25, '13,08 $ pièce · 1 par équipe'],
      ['TVA à l’import (20 %)', 1, 178, 'Si le fournisseur est hors UE'],
      ['Logo sponsor poitrine', 79, 4, '0 € si maillot sublimé'],
      ['Logo sponsor manche', 79, 2.5, '0 € si maillot sublimé'],
      ['Numéro + nom au dos', 79, 5, ''],
      ['Livraison et bon à tirer', 1, 40, '']
    ]],
    ['Visibilité autour du terrain', [
      ['Bâches PVC sponsors 3 × 1 m', 6, 55, 'Sur le grillage, dans le champ des caméras'],
      ['Beach flags à l’entrée', 4, 90, ''],
      ['Roll-up partenaires', 2, 65, ''],
      ['Mur photocall 2 × 2 m', 1, 220, 'Interviews, joueur du jour'],
      ['Affiches A2 et flyers', 1, 120, 'Lot pour la saison'],
      ['Fixations', 1, 40, 'Colliers, tendeurs, lests'],
      ['Droit d’affichage du complexe', 1, 0, 'À vérifier avec le gestionnaire']
    ]],
    ['Contenus & pubs entre les matchs', [
      ['Habillage du live et gestion OBS', 1, 0, 'Fait en interne'],
      ['Jingles et spots sponsors', 1, 0, 'Fait en interne'],
      ['Crédits IA pour les montages', 3, 30, '3 mois · highlights et formats courts'],
      ['Crédits vidéo IA Seedance 2.5', 3, 60, '3 mois · prix à confirmer selon la plateforme'],
      ['TV 55 pouces d’occasion + pied', 1, 380, 'Diffusion des spots sur place'],
      ['Enceinte sur batterie', 1, 180, 'Jingles et annonces']
    ]]
  ];
  const DEFAULT_PCT = 10;

  // Saved edits are tied to this version of the defaults, so updated figures are never hidden by old edits.
  const KEY = 'sfl-budget-' + [...JSON.stringify(DATA)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7);
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };

  const eur = v => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: Number.isInteger(Math.round(v * 100) / 100) ? 0 : 2 }).format(v);
  const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : 0; };
  const $ = id => document.getElementById(id);

  let html = '';
  DATA.forEach(([sec, lines], s) => {
    html += `<tr class="sec"><td colspan="3">${sec}</td><td class="r tot" id="s${s}"></td><td></td></tr>`;
    lines.forEach(([label, q, pu, note], i) => {
      const id = `${s}-${i}`;
      const internal = note === 'Fait en interne';
      html += `<tr${internal ? ' class="int"' : ''}><td>${label}</td>
        <td class="q"><input type="number" min="0" step="1" id="q${id}" value="${saved['q' + id] ?? q}" aria-label="Quantité ${label}"></td>
        <td class="pu"><input type="number" min="0" step="0.5" id="p${id}" value="${saved['p' + id] ?? pu}" aria-label="Prix unitaire ${label}"></td>
        <td class="r tot" id="t${id}"></td><td class="note">${note}</td></tr>`;
    });
  });
  $('rows').innerHTML = html;
  $('pct').value = saved.pct ?? DEFAULT_PCT;

  function update() {
    let base = 0;
    DATA.forEach(([, lines], s) => {
      let sub = 0;
      lines.forEach((_, i) => {
        const t = num($(`q${s}-${i}`).value) * num($(`p${s}-${i}`).value);
        $(`t${s}-${i}`).textContent = eur(t);
        sub += t;
      });
      $(`s${s}`).textContent = eur(sub);
      base += sub;
    });
    const cont = base * num($('pct').value) / 100;
    const total = base + cont;
    $('base').textContent = eur(base);
    $('cont').textContent = eur(cont);
    $('grand').textContent = eur(Math.round(total));
    $('grand-top').textContent = eur(Math.round(total));
    $('per-day').textContent = `soit ${eur(Math.round(total / SUNDAYS))} par dimanche`;
  }
  document.addEventListener('input', e => {
    if (e.target.tagName !== 'INPUT') return;
    saved[e.target.id] = e.target.value;
    store();
    update();
  });
  update();
})();
</script>
